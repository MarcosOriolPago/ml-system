# ML control team stack
#   Zot       -> Docker images (versioned by tag + digest)
#   MLflow    -> experiments + model registry (artifacts proxied, stored in SeaweedFS)
#   SeaweedFS -> S3-compatible storage for DVC datasets and MLflow artifacts
#   Postgres  -> MLflow metadata
#
# Usage: cp .env.example .env  (edit secrets)  &&  docker compose up -d

name: mlstack

services:
  # --- S3 storage (DVC datasets + MLflow artifacts) ---
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    # S3 users are generated from .env at startup, each scoped to its own bucket
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities": [
          {"name": "mlflow",
           "credentials": [{"accessKey": "$$MLFLOW_S3_ACCESS_KEY", "secretKey": "$$MLFLOW_S3_SECRET_KEY"}],
           "actions": ["Read:mlflow", "Write:mlflow", "List:mlflow", "Tagging:mlflow"]},
          {"name": "dvc",
           "credentials": [{"accessKey": "$$DVC_S3_ACCESS_KEY", "secretKey": "$$DVC_S3_SECRET_KEY"}],
           "actions": ["Read:dvc-storage", "Write:dvc-storage", "List:dvc-storage", "Tagging:dvc-storage"]}
        ]}
        EOF
        # volume.max=0: number of volumes grows with free disk space (default 8 fills up fast)
        exec weed server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 \
          -master.volumeSizeLimitMB=1024 -volume.max=0 -volume.index=leveldb \
          -s3 -s3.port=$$S3_PORT -s3.config=/tmp/s3.json
    environment:
      MLFLOW_S3_ACCESS_KEY: ${MLFLOW_S3_ACCESS_KEY}
      MLFLOW_S3_SECRET_KEY: ${MLFLOW_S3_SECRET_KEY}
      DVC_S3_ACCESS_KEY: ${DVC_S3_ACCESS_KEY}
      DVC_S3_SECRET_KEY: ${DVC_S3_SECRET_KEY}
      S3_PORT: ${S3_PORT:-8333}
    networks:
      default:
        # Inside the stack, STACK_HOST resolves to this container, so the S3 URL
        # MLflow puts in presigned links works for both MLflow and the team.
        aliases: ["${STACK_HOST}"]
    volumes:
      - seaweedfs_data:/data
    ports:
      - "${S3_PORT:-8333}:${S3_PORT:-8333}"  # S3 API (same port inside and out, see STACK_HOST alias)
      - "127.0.0.1:8888:8888"  # filer web UI (no auth -> localhost only)
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status && wget -q -O /dev/null http://localhost:$$S3_PORT/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the buckets once (idempotent)
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.47
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for b in mlflow dvc-storage; do
          echo "s3.bucket.create -name $$b" | weed shell -master=seaweedfs:9333 || true
        done
    restart: "no"

  # --- MLflow metadata DB (not exposed outside the stack) ---
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Experiments + model registry ---
  mlflow:
    build: ./mlflow
    image: mlstack/mlflow:3.16.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${MLFLOW_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MLFLOW_S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      # Must be reachable by clients too: MLflow hands out presigned S3 links
      # for downloads and large uploads, built from this URL.
      MLFLOW_S3_ENDPOINT_URL: http://${STACK_HOST:?set STACK_HOST in .env}:${S3_PORT:-8333}
    # --serve-artifacts: clients upload/download models through MLflow,
    # so the team only needs the MLflow URL, never S3 credentials.
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination s3://mlflow
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts ${MLFLOW_ALLOWED_HOSTS}
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  # --- Docker image registry (OCI) with web UI ---
  zot:
    image: ghcr.io/project-zot/zot-linux-amd64:v2.1.21
    restart: unless-stopped
    volumes:
      - zot_data:/var/lib/registry
      - ./zot/config.json:/etc/zot/config.json:ro
      - ./zot/htpasswd:/etc/zot/htpasswd:ro
    ports:
      - "${REGISTRY_PORT:-5001}:5000"  # registry API + web UI

volumes:
  seaweedfs_data:
  postgres_data:
  zot_data:
